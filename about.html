<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
        }

        ul {
            background-color: rgb(1, 1, 1);
            color: rgb(238, 235, 235);
            display: flex;
            font-size: 15px;
            list-style-type: none;
            padding: 10px;
            justify-content: space-around;
            align-items: center;
        }

        input,
        .btn-1 {
            padding: 10px;
            border: none;
        }

        .btn-1 {
            position: relative;
            right: 6px;
            background-color: greenyellow;
            border: none;
        }

        input:focus {
            outline: none;
        }

        .btn-1:hover {
            background-color: red;
            color: white;
            cursor: pointer;
        }

        .card {
            width: 270px;
            height: max-content;
            border: 2px solid gray;
            line-height: 25px;
            border-radius: 10px;
            text-align: center;
            overflow: hidden;
            margin: 20px;
            transition: 3s ease;
            box-shadow: 3px 10px 20px rgb(107, 106, 106);

        }

        .card:hover {
            cursor: pointer;
            box-shadow: 3px 10px 20px rgb(107, 106, 106);
        }

        img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 6px;

        }

        .heading {
            font-size: 20px;
            font-weight: 700;
        }

        .card-btn {
            width: 100%;
            padding: 10px;
            margin-top: 11px;
            background-color: rgb(255, 0, 0);
            color: rgb(252, 252, 252);
            border: none;
            /* overflow: hidden; */
        }

        .container {
            display: flex;
            flex-wrap: wrap;
        }
          a{
            color: white;
        }
    </style>
</head>

<body>
    <ul>
        <li><a href="./Home.html"> HOME </a></li>
        <li><a href="./About.html"> ABOUT </a></li>
        <li><a href="./ContactUs.html"> CONTACT US </a></li>
        <li><a href="./Register.html"> REGISTER </a></li>
        <li><a href="./Login.html"> LOGIN </a></li>
        <li><a href="./allProducts.html"> All Products </a></li>

        <select name="" id="dropdown" >
            <option value="100">100</option>
            <option value="200">200+</option>
        </select>
        <div>
            <input type="text" placeholder="Search here..." id="search">
            <button class="btn-1" >SEARCH</button>
        </div>
    </ul>
    <h1>ABOUT US PAGE</h1>
</body>

</html>
